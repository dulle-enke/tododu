<body>
<div class="app">
<aside class="sidebar" aria-label="Primary navigation">
 <div class="brand"><div class="brand-emblem" id="sideLogo"></div><div>daymark<small>YOUR DAILY SPACE</small></div></div>
 <button class="new-sidebar" id="desktopAdd"><span id="addIcon"></span> Add a task</button>
 <p class="side-title">Workspace</p>
 <nav id="sideNav"></nav>
 <div class="sidebar-project-header"><p class="side-title">My projects</p><button class="mini-plus" id="sideAddProject" aria-label="Add a project"></button></div>
 <nav id="sideProjects"></nav>
 <div class="side-bottom"><button class="side-link" data-view="settings" id="sideSettings"><span id="settingsIcon"></span> Settings & backups</button></div>
</aside>
<div class="content">
 <div class="content-inner">
  <div class="mobile-bar"><div class="mobile-brand"><div class="brand-emblem" id="mobileLogo"></div> daymark</div><span class="spacer"></span><button class="icon-btn" id="mobileSearch" aria-label="Search tasks"></button></div>
  <div class="topbar"><div class="date-label" id="topDate"></div><div class="top-actions"><button class="icon-btn" id="desktopSearch" aria-label="Search tasks"></button><div class="avatar" aria-hidden="true">ME</div></div></div>
  <div id="searchBar" class="search-bar"><span id="searchIcon"></span><input id="searchInput" type="search" placeholder="Search your tasks and notes…" aria-label="Search tasks"><button id="clearSearch" class="clear" aria-label="Close search">×</button></div>
  <header id="pageHead" class="page-head"></header>
  <main id="mainContent" aria-live="polite"></main>
 </div>
</div>
</div>
<nav class="bottom-nav" id="bottomNav" aria-label="Mobile navigation"></nav>
<button class="fab" id="mobileAdd" aria-label="Add a task"></button>
<dialog id="taskDialog" aria-label="Task editor">
 <form class="dialog-card" id="taskForm">
  <div class="dialog-head"><h2 id="taskDialogTitle">Add a task</h2><button class="x-btn" type="button" id="closeTask" aria-label="Close editor">×</button></div>
  <label class="form-label" for="taskName">Task</label><input id="taskName" class="field" maxlength="180" placeholder="What needs to be done?" required autocomplete="off">
  <label class="form-label" for="taskNotes">Description (optional)</label><textarea id="taskNotes" class="field" maxlength="3000" placeholder="Add a few details…"></textarea>
  <div class="form-grid"><div><label class="form-label" for="taskDue">Planned date</label><input id="taskDue" class="field" type="date"></div><div><label class="form-label" for="taskTime">Planned time (optional)</label><input id="taskTime" class="field" type="time"></div></div><div class="deadline-form-row"><label class="form-label" for="taskDeadline">Deadline · final cutoff</label><input id="taskDeadline" class="field" type="date"><p class="deadline-help">Separate from your planned date. Leave blank if there is no hard deadline.</p></div><div class="form-grid"><div><label class="form-label" for="taskPriority">Priority</label><select id="taskPriority" class="field"><option value="4">P4 · Normal</option><option value="3">P3 · Low</option><option value="2">P2 · Medium</option><option value="1">P1 · High</option></select></div></div>
  <div class="form-grid"><div><label class="form-label" for="taskProject">Project</label><select id="taskProject" class="field"></select></div><div><label class="form-label" for="taskRepeat">Repeat</label><select id="taskRepeat" class="field"><option value="none">Doesn't repeat</option><option value="daily">Every day</option><option value="weekdays">Weekdays</option><option value="weekly">Every week</option><option value="monthly">Every month</option><option value="yearly">Every year</option></select></div></div>
  <div class="form-grid"><div><label class="form-label" for="taskSection">Section</label><select id="taskSection" class="field"><option value="">No section</option></select></div><div><label class="form-label" for="taskLabels">Labels (comma-separated)</label><input id="taskLabels" class="field" placeholder="health, important" autocomplete="off"></div></div>
  <label class="form-label" for="subtaskInput">Subtasks</label><div id="subtaskItems" class="subtask-list"></div><div class="subtask-add-row"><input id="subtaskInput" class="field" maxlength="180" placeholder="Add a smaller step…"><button id="addSubtask" class="secondary" type="button">Add</button></div>
  <div class="dialog-footer"><button id="deleteTask" class="danger delete" type="button" hidden>Delete</button><button id="cancelTask" class="secondary" type="button">Cancel</button><button class="primary" type="submit">Save task</button></div>
 </form>
</dialog>
<dialog id="projectDialog" aria-label="Project editor">
 <form class="dialog-card" id="projectForm">
  <div class="dialog-head"><h2 id="projectDialogTitle">New project</h2><button class="x-btn" id="closeProject" type="button" aria-label="Close editor">×</button></div>
  <label class="form-label" for="projectName">Project name</label><input class="field" id="projectName" maxlength="60" placeholder="e.g. Learning, Home, Ideas" required>
  <label class="form-label" for="projectColor">Color</label><select class="field" id="projectColor"><option value="#3969ac">Blue</option><option value="#f2b701">Yellow</option><option value="#11a579">Green</option></select>
  <div class="dialog-footer"><button class="danger delete" id="deleteProject" type="button" hidden>Delete</button><button class="secondary" id="cancelProject" type="button">Cancel</button><button class="primary" type="submit">Save project</button></div>
 </form>
</dialog>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const ICON={inbox:'<rect x="3" y="4" width="18" height="15" rx="2"/><path d="M3 13h5l2 3h4l2-3h5"/>',today:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/><path d="m9 15 2 2 4-4"/>',upcoming:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 17h6"/>',all:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',completed:'<circle cx="12" cy="12" r="9"/><path d="m7.5 12 3 3 6-6"/>',projects:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M12 9h6M12 13h4"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.1 2.1-.1-.1a1.7 1.7 0 0 0-1.9-.3l-.3.1V21h-3v-.2a1.7 1.7 0 0 0-1.4-1.6l-1 .1a1.7 1.7 0 0 0-1 .4l-.1.1-2.1-2.1.1-.1a1.7 1.7 0 0 0 .3-1.9l-.1-.3H5v-3h.2A1.7 1.7 0 0 0 6.8 11l-.1-1a1.7 1.7 0 0 0-.4-1l-.1-.1 2.1-2.1.1.1a1.7 1.7 0 0 0 1.9.3l.3-.1V5h3v.2a1.7 1.7 0 0 0 1.4 1.6l1-.1a1.7 1.7 0 0 0 1-.4l.1-.1 2.1 2.1-.1.1a1.7 1.7 0 0 0-.3 1.9l.1.3H21v3h-.2a1.7 1.7 0 0 0-1.4 1.4z" transform="translate(-1 -1) scale(.98)"/>',plus:'<path d="M12 4v16M4 12h16"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',edit:'<path d="M12 19h9M16 4l4 4-11 11-5 1 1-5L16 4z"/>',check:'<path d="m4 12 5 5 11-11"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',repeat:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/>',spark:'<path d="m12 2 2 7 7 3-7 2-2 8-2-8-7-2 7-3 2-7z"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7h.01"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',upload:'<path d="M12 21V9m-5 5 5-5 5 5M4 7V3h16v4"/>',arrow:'<path d="m9 18 6-6-6-6"/>'};
const svg=(name,size=20)=>`<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[name]||ICON.all}</svg>`;
const $=s=>document.getElementById(s), el=(tag,cls='',text)=>{const a=document.createElement(tag);if(cls)a.className=cls;if(text!==undefined)a.textContent=text;return a};
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'t'+Date.now()+'-'+Math.random().toString(36).slice(2);
const isoDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>isoDate(new Date());
const fromISO=d=>{const [y,m,day]=(d||today()).split('-').map(Number);return new Date(y,m-1,day)};
const shiftDay=(date,n)=>{const d=fromISO(date);d.setDate(d.getDate()+n);return isoDate(d)};
const dateNice=(value,opts={month:'short',day:'numeric'})=>new Intl.DateTimeFormat(undefined,opts).format(fromISO(value));
const formatCount=(n,word='task')=>`${n} ${word}${n===1?'':'s'}`;
const KEY='daymark-tasks-v2',OLD_KEY='daymark-tasks-v1';
const paletteColor=(v)=>{const c=String(v||'').toLowerCase();if(['#388877','#11a579'].includes(c))return '#11a579';if(['#dfaa4b','#dcaa43','#f2b701'].includes(c))return '#f2b701';return '#3969ac'};
const init=()=>({version:3,projects:[{id:'p-personal',name:'Personal',color:'#3969ac'},{id:'p-learning',name:'Learning',color:'#f2b701'},{id:'p-home',name:'Home',color:'#11a579'}],sections:[],tasks:[],history:[],settings:{theme:'light',sort:'date',board:false,dailyGoal:3}});
function valid(v){return v&&typeof v==='object'&&Array.isArray(v.tasks)&&Array.isArray(v.projects)}
function normalize(v){const base=init();return {version:3,projects:v.projects.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string').map(p=>({...p,color:paletteColor(p.color)})),sections:Array.isArray(v.sections)?v.sections:[],tasks:v.tasks.filter(t=>t&&typeof t.title==='string').map(t=>({...t,id:t.id||uid(),notes:t.notes||'',due:t.due||null,deadline:t.deadline||null,time:t.time||'',priority:Math.max(1,Math.min(4,Number(t.priority)||4)),repeat:t.repeat||'none',labels:Array.isArray(t.labels)?t.labels:[],subtasks:Array.isArray(t.subtasks)?t.subtasks:[],sectionId:t.sectionId||null,completed:!!t.completed})),history:Array.isArray(v.history)?v.history:[],settings:{...base.settings,...(v.settings||{})}}}
function load(){try{let saved=JSON.parse(localStorage.getItem(KEY));if(valid(saved))return normalize(saved);saved=JSON.parse(localStorage.getItem(OLD_KEY));if(valid(saved))return normalize(saved);const personal=JSON.parse(localStorage.getItem('personal-hub-v1'));if(personal&&Array.isArray(personal.tasks)){const x=init();for(const t of personal.tasks){if(typeof (t.text||t.title)==='string')x.tasks.push({id:uid(),title:t.text||t.title,notes:'',due:t.due||null,deadline:null,time:'',priority:4,projectId:null,repeat:'none',labels:[],subtasks:[],completed:!!t.done,completedAt:null,createdAt:new Date().toISOString()})}return x}}catch(e){console.warn('Existing local data unreadable',e)}return init()}
let data=load();let view='today',searchOpen=false,searchTerm='',editingTask=null,editingProject=null,calendarDate=fromISO(today()),currentSection='',draftSubtasks=[],toastTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Browser storage is unavailable or full. Please export your tasks in Settings.');return false}}
function project(id){return data.projects.find(p=>p.id===id)}
function sectionsFor(projectId){return data.sections.filter(s=>s.projectId===projectId)}
function active(){return data.tasks.filter(t=>!t.completed)}
function allLabels(){return [...new Set(data.tasks.flatMap(t=>Array.isArray(t.labels)?t.labels:[]))].sort((a,b)=>a.localeCompare(b))}
function tasksFor(v){let items=active();if(v==='inbox')items=items.filter(t=>!t.projectId);else if(v==='today')items=items.filter(t=>(t.due&&t.due<=today())||(t.deadline&&t.deadline<=today()));else if(v==='upcoming')items=items.filter(t=>t.due||t.deadline);else if(v==='deadlines')items=items.filter(t=>t.deadline);else if(v.startsWith('project:'))items=items.filter(t=>t.projectId===v.slice(8));else if(v.startsWith('label:'))items=items.filter(t=>t.labels.includes(v.slice(6)));else if(v==='filter:high')items=items.filter(t=>t.priority<=2);else if(v==='filter:overdue')items=items.filter(t=>t.due&&t.due<today());else if(v==='filter:no-date')items=items.filter(t=>!t.due);else if(v==='filter:deadline-overdue')items=items.filter(t=>t.deadline&&t.deadline<today());else if(v==='filter:deadline-soon')items=items.filter(t=>t.deadline&&t.deadline>=today()&&t.deadline<=shiftDay(today(),7));else if(v==='filter:no-deadline')items=items.filter(t=>!t.deadline);else if(v.startsWith('date:'))items=items.filter(t=>t.due===v.slice(5)||t.deadline===v.slice(5));return sortTasks(items)}
function sortTasks(items){const kind=data.settings.sort;return [...items].sort((a,b)=>{if(kind==='priority'){const x=a.priority-b.priority;if(x)return x}else if(kind==='newest'){const x=(b.createdAt||'').localeCompare(a.createdAt||'');if(x)return x}const d=(a.due||'9999-99-99').localeCompare(b.due||'9999-99-99');if(d)return d;if(a.time!==b.time)return(a.time||'99:99').localeCompare(b.time||'99:99');return a.priority-b.priority||String(a.createdAt||'').localeCompare(String(b.createdAt||''))})}
function count(v){return tasksFor(v).length}
function toast(str){const node=$('toast');node.textContent=str;node.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('visible'),2600)}
function changeView(v){view=v;searchOpen=false;searchTerm='';$('searchBar').classList.remove('on');$('searchInput').value='';render();window.scrollTo(0,0)}
function clickable(v,label,icon,countNum=null){const b=el('button','side-link'+(view===v?' active':''));b.type='button';b.innerHTML=svg(icon,19);b.append(el('span','',label));if(countNum!==null)b.append(el('span','counter',String(countNum)));b.addEventListener('click',()=>changeView(v));return b}
function renderSidebar(){const nav=$('sideNav');nav.replaceChildren();for(const [v,name,icon,number] of [['inbox','Inbox','inbox',count('inbox')],['today','Today','today',count('today')],['upcoming','Upcoming','upcoming',null],['deadlines','Deadlines','calendar',count('deadlines')],['all','All tasks','all',count('all')],['calendar','Calendar','calendar',null],['filters','Filters & labels','search',null],['insights','Insights','spark',null],['completed','Completed','completed',null]])nav.append(clickable(v,name,icon,number));const side=$('sideProjects');side.replaceChildren();for(const p of data.projects){const row=el('div','project-sidebar-row');const b=el('button','side-link'+(view==='project:'+p.id?' active':''));const dot=el('span','dot');dot.style.setProperty('--dot',p.color);b.append(dot,el('span','project-name',p.name),el('span','counter',String(count('project:'+p.id))));b.onclick=()=>changeView('project:'+p.id);const edit=el('button','project-more');edit.type='button';edit.setAttribute('aria-label','Edit project '+p.name);edit.innerHTML=svg('edit',16);edit.onclick=()=>openProject(p);row.append(b,edit);side.append(row)}}
function renderBottom(){const nav=$('bottomNav');nav.replaceChildren();const selected=view.startsWith('project:')?'projects':(['all','completed','calendar','filters','insights','settings','deadlines'].includes(view)?'more':view);for(const [v,label,ic] of [['inbox','Inbox','inbox'],['today','Today','today'],['upcoming','Upcoming','upcoming'],['projects','Projects','projects'],['more','More','more']]){const b=el('button','bottom-tab'+(selected===v?' active':''));b.type='button';b.innerHTML=svg(ic,22);b.append(el('span','',label));b.onclick=()=>changeView(v);nav.append(b)}}
function headInfo(){if(view==='today')return ['YOUR DAILY FOCUS','Today','A clear space for what matters today.'];if(view==='inbox')return ['CAPTURE EVERYTHING','Inbox','Everything on your mind, in one place.'];if(view==='upcoming')return ['LOOK AHEAD','Upcoming','A little planning goes a long way.'];if(view==='deadlines')return ['HARD CUTOFFS','Deadlines','The dates that cannot slip.'];if(view==='all')return ['YOUR WORKSPACE','All tasks','Everything you need to do.'];if(view==='projects')return ['STAY ORGANIZED','Projects','A home for every part of your life.'];if(view==='calendar')return ['PLAN VISUALLY','Calendar','See your tasks across the month.'];if(view==='filters')return ['FIND YOUR FOCUS','Filters & labels','Only the tasks you need right now.'];if(view==='insights')return ['YOUR MOMENTUM','Insights','Celebrate every step forward.'];if(view==='completed')return ['LOOK HOW FAR YOU HAVE COME','Completed','All your finished tasks.'];if(view==='settings')return ['MAKE IT YOURS','Settings','Your app, your data, your choices.'];if(view==='more')return ['EXPLORE','More','More ways to organize your day.'];if(view.startsWith('project:'))return ['MY PROJECT',project(view.slice(8))?.name||'Project','Keep everything for this project together.'];if(view.startsWith('label:'))return ['LABEL','@'+view.slice(6),'Tasks with this label.'];if(view.startsWith('filter:'))return ['SMART FILTER',{high:'Priority 1 & 2',overdue:'Overdue','no-date':'No planned date','deadline-overdue':'Missed deadlines','deadline-soon':'Deadlines within 7 days','no-deadline':'No deadline'}[view.slice(7)]||'Filter','A focused view of your tasks.'];if(view.startsWith('date:'))return ['DAY PLAN',dateNice(view.slice(5),{weekday:'long',month:'long',day:'numeric'}),'Tasks for this day.'];return ['YOUR WORKSPACE','Daymark','Focus on what matters.']}
function renderHead(){const [eyebrow,title,sub]=headInfo();$('topDate').textContent=dateNice(today(),{weekday:'long',month:'long',day:'numeric',year:'numeric'});const head=$('pageHead');head.replaceChildren();const group=el('div');group.append(el('div','eyebrow',eyebrow),el('h1','',title),el('p','page-sub',sub));head.append(group);if(['today','inbox','all','upcoming','deadlines'].includes(view)||view.startsWith('project:')||view.startsWith('date:')||view.startsWith('label:')||view.startsWith('filter:')){const tools=el('div','head-actions');if(view.startsWith('project:')){const edit=el('button','head-toggle','Edit project');edit.onclick=()=>openProject(project(view.slice(8)));tools.append(edit);const mode=el('button','head-toggle',data.settings.board?'List view':'Board view');mode.onclick=()=>{data.settings.board=!data.settings.board;save();render()};tools.append(mode)}if(['all','upcoming','inbox','today'].includes(view)){const sort=el('select','compact-select');sort.setAttribute('aria-label','Sort tasks');for(const [key,text] of [['date','Due date'],['priority','Priority'],['newest','Newest']]){const o=el('option','',text);o.value=key;sort.append(o)}sort.value=data.settings.sort;sort.onchange=()=>{data.settings.sort=sort.value;save();render()};tools.append(sort)}else tools.append(el('div','page-count',formatCount(count(view))));head.append(tools)}}
function completeTask(t){if(t.completed){t.completed=false;t.completedAt=null;toast('Restored task')}else if(t.repeat&&t.repeat!=='none'){data.history.unshift({id:uid(),title:t.title,projectId:t.projectId,completedAt:new Date().toISOString(),due:t.due||today()});const baseline=t.due&&t.due>today()?t.due:today();let d=fromISO(baseline);if(t.repeat==='daily')d.setDate(d.getDate()+1);if(t.repeat==='weekdays'){do{d.setDate(d.getDate()+1)}while([0,6].includes(d.getDay()))}if(t.repeat==='weekly')d.setDate(d.getDate()+7);if(t.repeat==='monthly')d.setMonth(d.getMonth()+1);if(t.repeat==='yearly')d.setFullYear(d.getFullYear()+1);t.due=isoDate(d);t.subtasks.forEach(s=>s.done=false);toast('Done! Next occurrence scheduled')}else{t.completed=true;t.completedAt=new Date().toISOString();toast('Nice work — task completed')}save();render()}
function taskRow(t,historical=false){const row=el('div','task-row');const checked=historical||t.completed;const c=el('button','task-check'+(checked?' done':t.priority<=3?' p'+t.priority:''));c.type='button';c.setAttribute('aria-label',checked?'Restore '+t.title:'Complete '+t.title);if(checked)c.innerHTML=svg('check',13);if(historical)c.disabled=true;else c.onclick=()=>completeTask(t);const detail=el('button','task-details');detail.type='button';detail.append(el('span','task-title'+(checked?' is-done':''),t.title));if(t.notes)detail.append(el('span','task-notes',t.notes));const metadata=el('div','task-meta');if(t.due){const m=el('span','meta'+(t.due<today()&&!checked?' overdue':t.due===today()&&!checked?' today':''));m.innerHTML=svg('calendar',12);m.append(document.createTextNode(t.due===today()?'Today':t.due===shiftDay(today(),1)?'Tomorrow':dateNice(t.due)));if(t.time)m.append(document.createTextNode(' · '+t.time));metadata.append(m)}if(t.deadline){const diff=Math.round((fromISO(t.deadline)-fromISO(today()))/86400000);const status=(!checked&&diff<0)?' deadline-missed':(!checked&&diff<=3)?' deadline-near':' deadline-normal';const m=el('span','meta deadline-chip'+status);m.innerHTML=svg('calendar',12);const word=diff<0?'Deadline missed':diff===0?'Deadline today':diff===1?'Deadline tomorrow':'Deadline';m.append(document.createTextNode(word+(diff>1||diff<0?' · '+dateNice(t.deadline):'')));m.setAttribute('aria-label','Deadline '+t.deadline);metadata.append(m)}if(t.projectId&&project(t.projectId)){const m=el('span','meta project');const dot=el('span','dot');dot.style.cssText=`width:7px;height:7px;--dot:${project(t.projectId).color}`;m.append(dot,document.createTextNode(project(t.projectId).name));metadata.append(m)}if(t.repeat!=='none'){const m=el('span','meta');m.innerHTML=svg('repeat',12);m.append(document.createTextNode('Repeats'));metadata.append(m)}for(const name of (t.labels||[]).slice(0,3)){const label=el('span','tag','@'+name);metadata.append(label)}if((t.subtasks function renderCalendar(host){const year=calendarDate.getFullYear(),month=calendarDate.getMonth();const bar=el('div','calendar-toolbar');const title=el('h2','',new Intl.DateTimeFormat(undefined,{month:'long',year:'numeric'}).format(calendarDate));const prev=el('button','icon-btn');prev.innerHTML=svg('arrow',18);prev.style.transform='rotate(180deg)';prev.setAttribute('aria-label','Previous month');prev.onclick=()=>{calendarDate=new Date(year,month-1,1);render()};const next=el('button','icon-btn');next.innerHTML=svg('arrow',18);next.setAttribute('aria-label','Next month');next.onclick=()=>{calendarDate=new Date(year,month+1,1);render()};const present=el('button','head-toggle','Today');present.onclick=()=>{calendarDate=fromISO(today());render()};const controls=el('div','calendar-controls');controls.append(present,prev,next);bar.append(title,controls);host.append(bar);const grid=el('div','calendar-grid');for(const day of ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'])grid.append(el('span','calendar-weekday',day));const first=(new Date(year,month,1).getDay()+6)%7;const days=new Date(year,month+1,0).getDate();for(let i=0;i<Math.ceil((first+days)/7)*7;i++){const n=i-first+1;const b=el('button','calendar-cell'+(n<1||n>days?' outside':''));b.type='button';if(n>=1&&n<=days){const iso=isoDate(new Date(year,month,n));if(iso===today())b.classList.add('is-today');b.append(el('span','calendar-num',String(n)));const taskCount=active().filter(t=>t.due===iso||t.deadline===iso).length;if(taskCount){b.append(el('span','calendar-dots',Array(Math.min(taskCount,3)).fill('•').join('')));b.setAttribute('aria-label',`${dateNice(iso)}: ${formatCount(taskCount)}`)}else b.setAttribute('aria-label',dateNice(iso));b.onclick=()=>changeView('date:'+iso)}grid.append(b)}host.append(grid);host.append(el('p','footer-note','Tap any day to see tasks planned for that day or reaching their deadline.'))}
function renderInsights(host){const seven=Array.from({length:7},(_,i)=>shiftDay(today(),i-6));const entries=[...data.history,...data.tasks.filter(t=>t.completed)];const counts=seven.map(d=>entries.filter(t=>t.completedAt?.slice(0,10)===d).length);const total=entries.length;const todayDone=counts[6];const card=el('div','insight-big');card.append(el('div','eyebrow','SMALL STEPS ADD UP'),el('div','insight-num',String(total)),el('div','muted','total tasks completed'));host.append(card);const summary=el('div','stat-row');for(const [label,val] of [['Today',todayDone],['Last 7 days',counts.reduce((a,b)=>a+b,0)],['Active tasks',active().length]]){const item=el('div','stat-box');item.append(el('strong','',String(val)),el('span','muted small',label));summary.append(item)}host.append(summary);groupTitle(host,'Last 7 days',counts.reduce((a,b)=>a+b,0));const bars=el('div','insights-bars');for(let i=0;i<7;i++){const col=el('div','insight-bar-cell');const track=el('div','insight-track');const fill=el('div','insight-fill');fill.style.height=`${Math.max(5,counts[i]/Math.max(1,...counts)*100)}%`;track.append(fill);col.append(el('span','small',String(counts[i])),track,el('span','small muted',dateNice(seven[i],{weekday:'short'})));bars.append(col)}host.append(bars)}

function openTask(t=null,sectionOverride=null,dueOverride=null){editingTask=t?.id||null;$('taskDialogTitle').textContent=t?'Edit task':'Add a task';$('taskName').value=t?.title||'';$('taskNotes').value=t?.notes||'';$('taskDue').value=t?.due||(dueOverride||(view==='today'||view==='upcoming'?today():view.startsWith('date:')?view.slice(5):''));$('taskTime').value=t?.time||'';$('taskDeadline').value=t?.deadline||'';$('taskPriority').value=String(t?.priority||4);$('taskRepeat').value=t?.repeat||'none';$('taskLabels').value=(t?.labels||[]).join(', ');draftSubtasks=(t?.subtasks||[]).map(s=>({...s}));draftList();const proj=$('taskProject');proj.replaceChildren();const zero=el('option','','Inbox (no project)');zero.value='';proj.append(zero);for(const p of data.projects){const opt=el('option','',p.name);opt.value=p.id;proj.append(opt)}proj.value=t?.projectId||(view.startsWith('project:')?view.slice(8):'');sectionOptions(proj.value,t?.sectionId||sectionOverride);$('deleteTask').hidden=!t;$('taskDialog').showModal();setTimeout(()=>$('taskName').focus(),35)}
function closeTask(){$('taskDialog').close();editingTask=null}
function parseQuickTitle(raw,fields){let title=raw;const lower=raw.toLowerCase();{if(/\btomorrow\b/i.test(title)){fields.due=shiftDay(today(),1);title=title.replace(/\btomorrow\b/i,'')}else if(/\btoday\b/i.test(title)){fields.due=today();title=title.replace(/\btoday\b/i,'')}}const match=title.match(/(?:^|\s)p([1-4])(?:\s|$)/i);if(match){fields.priority=Number(match[1]);title=title.replace(match[0],' ')}title=title.replace(/(^|\s)@([\p{L}\p{N}_-]+)/gu,(_,space,label)=>{fields.labels.push(label.toLowerCase());return space});const projectTag=title.match(/(^|\s)#([\p{L}\p{N}_-]+)/u);if(projectTag){const p=data.projects.find(p=>p.name.toLowerCase().replace(/\s/g,'-')===projectTag[2].toLowerCase());if(p){fields.projectId=p.id;title=title.replace(projectTag[0],projectTag[1])}}const recurring=[['every weekday','weekdays'],['every day','daily'],['every week','weekly'],['every month','monthly'],['every year','yearly']].find(([txt])=>lower.includes(txt));if(recurring&&fields.repeat==='none'){fields.repeat=recurring[1];title=title.replace(new RegExp(recurring[0],'i'),'');fields.due=fields.due||today()}return title.replace(/\s+/g,' ').trim()||raw}
$('taskProject').addEventListener('change',()=>sectionOptions($('taskProject').value,null));
$('addSubtask').onclick=()=>{const value=$('subtaskInput').value.trim();if(!value)return;draftSubtasks.push({id:uid(),text:value,done:false});$('subtaskInput').value='';draftList();$('subtaskInput').focus()};
$('subtaskInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('addSubtask').click()}});
$('taskForm').addEventListener('submit',e=>{e.preventDefault();const raw=$('taskName').value.trim();if(!raw)return;const fields={title:raw,notes:$('taskNotes').value.trim(),due:$('taskDue').value||null,deadline:$('taskDeadline').value||null,time:$('taskTime').value||'',priority:Number($('taskPriority').value)||4,projectId:$('taskProject').value||null,sectionId:$('taskSection').value||null,repeat:$('taskRepeat').value,labels:[...new Set($('taskLabels').value.split(',').map(t=>t.trim().replace(/^@/,'').toLowerCase()).filter(Boolean))].slice(0,15),subtasks:draftSubtasks.map(s=>({...s,text:s.text.trim()})).filter(s=>s.text)};const old=data.tasks.find(t=>t.id===editingTask);if(!old)fields.title=parseQuickTitle(raw,fields);if(fields.repeat!=='none'&&!fields.due)fields.due=today();if(fields.due&&fields.deadline&&fields.due>fields.deadline&&!confirm('Your planned date is after the deadline. Save anyway?'))return;if(old){Object.assign(old,fields);toast('Task updated')}else{data.tasks.push({id:uid(),...fields,completed:false,completedAt:null,createdAt:new Date().toISOString()});toast('Task added')}save();closeTask();render()});
$('deleteTask').onclick=()=>{if(!editingTask||!confirm('Delete this task?'))return;data.tasks=data.tasks.filter(t=>t.id!==editingTask);save();closeTask();render();toast('Task deleted')};
$('closeTask').onclick=closeTask;$('cancelTask').onclick=closeTask;$('taskDialog').onclick=e=>{if(e.target===$('taskDialog'))closeTask()};
function openProject(p=null){editingProject=p?.id||null;$('projectDialogTitle').textContent=p?'Edit project':'New project';$('projectName').value=p?.name||'';$('projectColor').value=p?paletteColor(p.color):'#3969ac';$('deleteProject').hidden=!p;$('projectDialog').showModal();setTimeout(()=>$('projectName').focus(),35)}
function closeProject(){$('projectDialog').close();editingProject=null}
$('projectForm').addEventListener('submit',e=>{e.preventDefault();const name=$('projectName').value.trim();if(!name)return;const colour=$('projectColor').value;const p=project(editingProject);if(p){p.name=name;p.color=colour;toast('Project updated')}else{const fresh={id:uid(),name,color:colour};data.projects.push(fresh);view='project:'+fresh.id;toast('Project created')}save();closeProject();render()});
$('deleteProject').onclick=()=>{if(!editingProject||!confirm('Delete this project? Its tasks will move to Inbox.'))return;for(const t of data.tasks)if(t.projectId===editingProject){t.projectId=null;t.sectionId=null}for(const t of data.history)if(t.projectId===editingProject)t.projectId=null;data.sections=data.sections.filter(s=>s.projectId!==editingProject);data.projects=data.projects.filter(p=>p.id!==editingProject);save();closeProject();changeView('projects');toast('Project deleted')};
$('closeProject').onclick=closeProject;$('cancelProject').onclick=closeProject;$('projectDialog').onclick=e=>{if(e.target===$('projectDialog'))closeProject()};
$('sideAddProject').innerHTML=svg('plus',18);$('sideAddProject').onclick=()=>openProject();$('desktopAdd').onclick=()=>openTask();$('mobileAdd').innerHTML=svg('plus',25);$('mobileAdd').onclick=()=>openTask();
$('sideLogo').innerHTML=svg('check',24);$('mobileLogo').innerHTML=svg('check',19);$('addIcon').innerHTML=svg('plus',19);$('settingsIcon').innerHTML=svg('settings',19);$('desktopSearch').innerHTML=svg('search',19);$('mobileSearch').innerHTML=svg('search',19);$('searchIcon').innerHTML=svg('search',18);
function toggleSearch(){searchOpen=!searchOpen;$('searchBar').classList.toggle('on',searchOpen);if(searchOpen)$('searchInput').focus();else{searchTerm='';$('searchInput').value=''}render()}
$('desktopSearch').onclick=toggleSearch;$('mobileSearch').onclick=toggleSearch;$('clearSearch').onclick=()=>{searchOpen=false;searchTerm='';$('searchInput').value='';$('searchBar').classList.remove('on');render()};$('searchInput').addEventListener('input',e=>{searchTerm=e.target.value;render()});
$('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const json=JSON.parse(await file.text());const incoming=json.data||json;if(!valid(incoming))throw Error('Not a valid Daymark backup');if(!confirm('Replace your saved tasks on this device with this backup?'))return;data=normalize(incoming);save();changeView('today');toast('Backup imported')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}});
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.querySelector('dialog[open]'))return;if(e.key.toLowerCase()==='n'){e.preventDefault();openTask()}if(e.key==='/'){e.preventDefault();if(!searchOpen)toggleSearch()}});
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(err=>console.warn('Offline mode unavailable',err));

</script>
</body>
